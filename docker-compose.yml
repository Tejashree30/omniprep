services:
  db:
    image: pgvector/pgvector:pg16
    environment: {POSTGRES_USER: omni, POSTGRES_PASSWORD: omni, POSTGRES_DB: omniprep}
    volumes: ["./db/init.sql:/docker-entrypoint-initdb.d/init.sql", "pgdata:/var/lib/postgresql/data"]
  redis:
    image: redis:alpine
  backend:
    build: ./backend
    env_file: .env.example
    environment:
      - OPENROUTER_API_KEY=${OPENROUTER_API_KEY:-}
    volumes: ["uploads:/data/uploads"]
    ports: ["8000:8000"]
    depends_on: [db, redis]
  worker:
    build: ./backend
    command: celery -A app.tasks.celery_app worker --loglevel=info
    env_file: .env.example
    environment:
      - OPENROUTER_API_KEY=${OPENROUTER_API_KEY:-}
    volumes: ["uploads:/data/uploads"]
    depends_on: [db, redis]
  frontend:
    build: ./frontend
    environment: {NEXT_PUBLIC_API: "http://localhost:8000"}
    ports: ["3000:3000"]
    depends_on: [backend]
volumes: {pgdata: {}, uploads: {}}
